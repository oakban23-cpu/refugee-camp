<script>
/* ตัวเชื่อมออนไลน์: ทำให้ claude.use('room') ทำงานผ่านเซิร์ฟเวอร์กลางของเรา (WebSocket) */
function localRoom(H){
  const ch=new BroadcastChannel('refugee_local_v1'),peers={},R={hostUid:'',count:1,allPlayers:null,ok:true,url:'',local:true};
  let pres=null,cb=null;
  const post=o=>{try{ch.postMessage(o)}catch(e){}};
  function alive(){const n=Date.now();Object.keys(peers).forEach(u=>{if(n-peers[u].t>2500)delete peers[u]});return Object.values(peers)}
  function refresh(){
    const l=alive().filter(x=>pres&&(x.p.mp||1)===(pres.mp||1)).map(x=>x.p.uid);
    if(pres){l.push(pres.uid);R.hostUid=l.sort()[0];R.count=l.length}
    cb&&cb({peers:alive().map(x=>({presence:x.p}))})}
  ch.onmessage=e=>{const m=e.data;if(!m)return;
    if(m.t==='pres'&&m.p&&m.p.uid){peers[m.p.uid]={p:m.p,t:Date.now()};refresh()}
    else if(m.t==='bye'){delete peers[m.u];refresh()}
    else if(m.t==='emit'&&H[m.k])H[m.k].forEach(f=>f({data:m.d,sameTab:false,from:m.from}))};
  setInterval(refresh,500);
  addEventListener('pagehide',()=>{if(pres)post({t:'bye',u:pres.uid})});
  return Object.assign(R,{
    onPeers:f=>{cb=f},
    on:(k,f)=>{(H[k]=H[k]||[]).push(f)},
    presence:p=>{pres=p;post({t:'pres',p})},
    emit:(k,d)=>post({t:'emit',k,d,from:pres?pres.uid:''})})
}
window.claude={use:async n=>{
  if(n==='user')return{id:async()=>null};
  if(n!=='room')throw new Error('no '+n);
  const H={},st={ws:null,pres:null,cb:null,info:{}};
  function srvUrl(){
    if(/^https?:$/.test(location.protocol)&&location.host)return(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
    let v='';try{v=new URLSearchParams(location.search).get('server')||localStorage.getItem('refugee_server')||''}catch(e){}
    v=String(v).trim().replace(/^(https?|wss?):\/\//,'').replace(/\/.*$/,'');if(!v)return'';
    return(/^(localhost|\d+\.\d+\.\d+\.\d+)(:|$)/.test(v)?'ws://':'wss://')+v+'/ws'}
  const url=srvUrl();
  const R={hostUid:'',count:0,allPlayers:null,ok:false,url};
  function conn(){
    if(!url)return;
    let w;try{w=new WebSocket(url)}catch(e){return setTimeout(conn,2000)}
    st.ws=w;
    w.onopen=()=>{R.ok=true;if(st.pres)w.send(JSON.stringify({t:'presence',p:st.pres}))};
    w.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
      if(m.t==='peers'){
        (m.info||[]).forEach(([u,n,c,l,mh,mp,hd,bt,tt])=>{st.info[u]={n,cls:c,lv:l,mh,mp,hd,bt,tt}});
        R.hostUid=m.host||'';R.count=m.n||0;R.allPlayers=m.all||null;
        const peers=m.rows.map(([u,x,y,hp,sl])=>{const i=st.info[u]||{};return{presence:{uid:u,x,y,hp,sl,n:i.n,cls:i.cls,lv:i.lv,mh:i.mh,mp:i.mp,hd:i.hd,bt:i.bt,tt:i.tt}}});
        st.cb&&st.cb({peers})}
      else if(m.t==='emit'&&H[m.k])H[m.k].forEach(f=>f({data:m.d,sameTab:false,from:m.from}))};
    w.onclose=()=>{R.ok=false;R.hostUid='';R.count=0;R.allPlayers=null;st.cb&&st.cb({peers:[]});setTimeout(conn,2000)};
    w.onerror=()=>{try{w.close()}catch(x){}}}
  if(!url&&typeof BroadcastChannel==='function')return localRoom(H);
  conn();
  return Object.assign(R,{
    onPeers:f=>{st.cb=f},
    on:(k,f)=>{(H[k]=H[k]||[]).push(f)},
    presence:p=>{st.pres=p;if(st.ws&&st.ws.readyState===1)st.ws.send(JSON.stringify({t:'presence',p}))},
    emit:(k,d)=>{if(st.ws&&st.ws.readyState===1)st.ws.send(JSON.stringify({t:'emit',k,d}))}})
}};

function autoSell(){

    // ขายเฉพาะของที่ด้อยกว่าทั้งแบบสวมใส่จริง (รวมค่าตีบวก) และแบบสเตตัสดิบก่อนตีบวก

    if(gScore(it)<gScore(cur)-.004&&gScoreBase(it)<gScoreBase(cur)-.004){g+=sellPrice(it);n++;return false}

    }else{
      saves=cleanSaves(lsRead());saveMode='local';
    }
  }catch(e){
    saveMode='off';saveDoc=null;
  }
  setSaveState(saveMode==='db'?'บันทึกออนไลน์':saveMode==='local'?'บันทึกในเบราว์เซอร์นี้':'ไม่ได้บันทึก');
  if(!me.cls)intro();
}
async function writeSave(){
  if(inflight||!me.cls||saveMode==='wait'||saveMode==='off')return;
  const j=JSON.stringify(snap());if(j===lastJ)return;
  const next={v:1,chars:Object.assign({},saves.chars),last:me.cls};next.chars[me.cls]=cleanChar(JSON.parse(j));
  inflight=true;
  try{
    if(saveMode==='db')await saveDoc.set(next);
    else if(!lsWrite(next))throw {code:'ls'};
    saves=next;lastJ=j;setSaveState(saveMode==='db'?'บันทึกออนไลน์ แล้ว':'บันทึกในเบราว์เซอร์นี้ แล้ว');
  }catch(e){
    if(saveMode==='db'&&lsWrite(next)){saves=next;lastJ=j;saveMode='local';setSaveState('ออนไลน์ไม่ได้ บันทึกในเบราว์เซอร์นี้แทน')}
    else{saveMode='off';setSaveState('บันทึกไม่ได้ (ต้องมีสิทธิ์ Can edit)')}
  }
  inflight=false;
}
async function deleteChar(c){
  if(saveMode==='wait'||saveMode==='off')return;
  const next={v:1,chars:Object.assign({},saves.chars),last:saves.last===c?null:saves.last};delete next.chars[c];
  try{if(saveMode==='db')await saveDoc.set(next);else lsWrite(next);saves=next}catch(e){}
  delArm=null;intro();
}

function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(s)))}
async function importSave(txt){
  const m=$('bkm');
  try{
    txt=txt.trim().replace(/^RFG1:/,'');
    const d=cleanSaves(JSON.parse(b64d(txt)));
    const ks=Object.keys(d.chars);if(!ks.length){m.textContent='ไม่พบเซฟในรหัสนี้';return}
    if(saveMode==='wait'||saveMode==='off'){m.textContent='ตอนนี้บันทึกไม่ได้';return}
    const next={v:1,chars:Object.assign({},saves.chars),last:d.last||saves.last};
    ks.forEach(k=>{const o=next.chars[k];if(!o||d.chars[k].lv>=o.lv)next.chars[k]=d.chars[k]});
    if(saveMode==='db')await saveDoc.set(next);else lsWrite(next);
    saves=next;delArm=null;intro();
    const b=$('bk');if(b)b.open=true;$('bkm').textContent='นำเข้าแล้ว '+ks.length+' ตัวละคร (ตัวที่เลเวลสูงกว่าจะถูกเก็บไว้)';
  }catch(e){m.textContent='รหัสไม่ถูกต้อง'}
}
